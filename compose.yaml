# Development-only full-stack starter. Never deploy these example DB credentials.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saire_learning
      POSTGRES_USER: saire_dev
      POSTGRES_PASSWORD: change-me-for-production
    volumes:
      - saire_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saire_dev -d saire_learning"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-dev-only-change-before-deploy
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://saire_dev:change-me-for-production@db:5432/saire_learning
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_curriculum && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_LMS_API_URL: http://127.0.0.1:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  saire_postgres:
